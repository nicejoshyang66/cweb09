<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- (二)3. 首頁標題 -->
    <title>國立科技高中─校園社團介紹網</title>
    <style>
        body {
            margin: 0;
        }

        /* (一)2. 版面 1024×768px，水平置中；(二)4. 首頁區 */
        .page {
            width: 1024px;
            height: 768px;
            margin: 0 auto;
        }

        /* (二)4. 網站標題區(top) 高 65px */
        .top {
            height: 65px;
            text-align: center;
        }

        /* 標題區與頁尾之間：左欄(menu+update) + 右欄(marquee+content) */
        .main {
            display: flex;
            height: calc(768px - 65px - 20px);
        }

        .left {
            width: calc(1024px - 770px);
        }

        .right {
            width: 770px;
        }

        /* (五) 選單區(menu) */
        .menu {
            height: calc(768px - 65px - 20px - 25px);
            font-family: "標楷體", DFKai-SB;
            font-weight: 500;
            color: #000000;
            font-size: 16px;
        }

        /* (五)3.4. 「社團介紹」24px、底線、置中、#FF00FF */
        .menu-title {
            font-size: 24px;
            text-decoration: underline;
            text-align: center;
            color: #FF00FF;
        }

        /* (五)7. 平常狀態背景 menu1.png */
        .menu a {
            display: block;
            height: 30px;
            line-height: 30px;
            margin: 5px;
            text-align: center;
            color: #000000;
            text-decoration: none;
            background: url(images/menu1.png);
            background-size: 100% 100%;
        }

        /* (五)8. 滑鼠移到上方背景換 menu2.png */
        .menu a:hover {
            background-image: url(images/menu2.png);
        }

        /* (六) 日期更新區(update) 高 25px */
        .update {
            height: 25px;
            font-family: "標楷體", DFKai-SB;
            color: #000000;
            text-align: center;
            font-size: 16px;
        }

        /* (四) 跑馬燈廣告區(marquee) 高 29px、寬 770px */
        .marquee {
            /* display: block; */
            /* display: block; */
            height: 29px;
            width: 770px;
            font-family: "標楷體", DFKai-SB;
            font-size: 24px;
            color: #0000FF;
        }

        /* (二)5. 網頁內容區(content) */
        .content {
            display: block;
            width: 770px;
            height: calc(768px - 65px - 20px - 29px);
            border: 0;
        }

        /* (十一) 頁尾版權區(footer) 高 20px，橫跨整個版面寬度 */
        .footer {
            height: 20px;
            font-family: "標楷體", DFKai-SB;
            color: #000000;
            text-align: center;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="page">
        <!-- (三) 網站標題區：logo.png 高60 寬994，替代文字，點按回首頁 -->
        <div class="top">
            <a href="index.html"><img src="images/logo.png" width="994" height="60" alt="國立科技高中校園社團介紹網"></a>
        </div>
        <div class="main">
            <div class="left">
                <!-- (五) 選單區 -->
                <div class="menu">
                    <div class="menu-title">社團介紹</div>
                    <!-- (五)9. 吉他社連結到 guitar_history.html，顯示於網頁內容區 -->
                    <a href="guitar_history.html" target="content">吉他社</a>
                    <!-- (五)6. 其餘社團項目 -->
                    <a href="#">熱舞社</a>
                    <a href="#">棒球社</a>
                    <a href="#">羽球社</a>
                    <a href="#">足球社</a>
                    <a href="#">童軍社</a>
                </div>
                <!-- (六) 日期更新區 -->
                <div class="update">最近更新日期：2026/10/20</div>
            </div>
            <div class="right">
                <!-- (四) 跑馬燈廣告區 -->
                <marquee class="marquee">歡迎光臨校園社團介紹網，參觀後請支持社團活動並熱烈參與</marquee>
                <!-- (二)5. 網頁內容區，預設 main.html -->
                <iframe class="content" src="main.html" name="content"></iframe>
            </div>
        </div>
        <!-- (十一) 頁尾版權區 -->
        <div class="footer">網頁設計及維護：XX○○○</div>
    </div>

</body>

</html>
